<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Image Quality Enhancer</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f3f4f6;
      color: #111827;
      min-height: 100vh;
    }

    header {
      background: #111827;
      color: white;
      text-align: center;
      padding: 30px 15px;
    }

    header h1 {
      font-size: 32px;
      margin-bottom: 8px;
    }

    header p {
      color: #d1d5db;
    }

    .container {
      max-width: 800px;
      margin: 40px auto;
      padding: 20px;
    }

    .box {
      background: white;
      padding: 30px;
      border-radius: 16px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.08);
      text-align: center;
    }

    input[type="file"] {
      margin: 20px 0;
      width: 100%;
      padding: 12px;
      border: 2px dashed #2563eb;
      border-radius: 10px;
    }

    img {
      max-width: 100%;
      max-height: 450px;
      margin: 20px auto;
      border-radius: 10px;
      display: none;
    }

    .controls {
      margin-top: 20px;
      display: none;
    }

    label {
      display: block;
      margin: 15px 0 8px;
      font-weight: bold;
    }

    select,
    input[type="range"] {
      width: 100%;
      padding: 10px;
    }

    button {
      margin-top: 25px;
      padding: 14px 25px;
      border: none;
      border-radius: 8px;
      background: #2563eb;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #1d4ed8;
    }

    #downloadBtn {
      display: none;
      background: #16a34a;
    }

    #downloadBtn:hover {
      background: #15803d;
    }

    .note {
      margin-top: 20px;
      color: #6b7280;
      font-size: 14px;
    }
  </style>
</head>

<body>

<header>
  <h1>✨ Image Quality Enhancer</h1>
  <p>Resize, sharpen and improve your image</p>
</header>

<div class="container">
  <div class="box">

    <h2>Upload Your Image</h2>

    <input type="file" id="imageInput" accept="image/*">

    <img id="preview" alt="Image Preview">

    <div class="controls" id="controls">

      <label for="scale">Image Size</label>

      <select id="scale">
        <option value="1">1× Normal</option>
        <option value="2" selected>2× HD</option>
        <option value="3">3× High Resolution</option>
      </select>

      <label for="sharpness">
        Sharpness
      </label>

      <input
        type="range"
        id="sharpness"
        min="0"
        max="5"
        value="2"
      >

      <button onclick="enhanceImage()">
        ✨ Enhance Image
      </button>

    </div>

    <a id="downloadBtn">
      <button>⬇️ Download Enhanced Image</button>
    </a>

    <p class="note">
      Your image is processed directly in your browser.
    </p>

  </div>
</div>

<script>
  const imageInput = document.getElementById("imageInput");
  const preview = document.getElementById("preview");
  const controls = document.getElementById("controls");
  const downloadBtn = document.getElementById("downloadBtn");

  let originalImage = new Image();

  imageInput.addEventListener("change", function () {

    const file = this.files[0];

    if (!file) return;

    const reader = new FileReader();

    reader.onload = function(e) {

      originalImage.onload = function() {
        preview.src = e.target.result;
        preview.style.display = "block";
        controls.style.display = "block";
      };

      originalImage.src = e.target.result;
    };

    reader.readAsDataURL(file);
  });

  function enhanceImage() {

    const scale =
      Number(document.getElementById("scale").value);

    const sharpness =
      Number(document.getElementById("sharpness").value);

    const canvas = document.createElement("canvas");

    canvas.width = originalImage.width * scale;
    canvas.height = originalImage.height * scale;

    const ctx = canvas.getContext("2d");

    ctx.imageSmoothingEnabled = true;
    ctx.imageSmoothingQuality = "high";

    ctx.filter =
      "contrast(" + (100 + sharpness * 5) + "%) " +
      "brightness(105%)";

    ctx.drawImage(
      originalImage,
      0,
      0,
      canvas.width,
      canvas.height
    );

    const result = canvas.toDataURL("image/jpeg", 0.95);

    preview.src = result;

    downloadBtn.href = result;
    downloadBtn.download = "enhanced-image.jpg";
    downloadBtn.style.display = "inline-block";
  }
</script>

</body>
</html>
