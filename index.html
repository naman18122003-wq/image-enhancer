<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AI Image Enhancer</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial,sans-serif;
}

body{
  background:#eef2ff;
  color:#111827;
  min-height:100vh;
}

header{
  background:#111827;
  color:white;
  text-align:center;
  padding:30px 15px;
}

header h1{
  font-size:32px;
  margin-bottom:8px;
}

header p{
  color:#cbd5e1;
}

.container{
  max-width:850px;
  margin:35px auto;
  padding:15px;
}

.box{
  background:white;
  padding:25px;
  border-radius:18px;
  box-shadow:0 8px 30px rgba(0,0,0,.10);
  text-align:center;
}

.upload{
  margin:20px 0;
  padding:20px;
  border:2px dashed #4f46e5;
  border-radius:12px;
}

input[type=file]{
  width:100%;
  padding:10px;
}

.preview{
  width:100%;
  max-height:500px;
  object-fit:contain;
  margin:20px 0;
  border-radius:12px;
  display:none;
}

.controls{
  display:none;
  text-align:left;
  margin-top:20px;
}

label{
  display:block;
  font-weight:bold;
  margin:18px 0 8px;
}

select,
input[type=range]{
  width:100%;
}

select{
  padding:12px;
  border:1px solid #cbd5e1;
  border-radius:8px;
}

button{
  width:100%;
  margin-top:25px;
  padding:15px;
  border:0;
  border-radius:10px;
  background:#4f46e5;
  color:white;
  font-size:17px;
  font-weight:bold;
}

button:active{
  transform:scale(.98);
}

#downloadBtn{
  display:none;
  background:#16a34a;
  margin-top:12px;
}

.status{
  margin-top:15px;
  font-weight:bold;
  color:#4f46e5;
}

.note{
  margin-top:20px;
  color:#64748b;
  font-size:13px;
}
</style>
</head>

<body>

<header>
  <h1>✨ AI Image Enhancer</h1>
  <p>Upscale • Sharpen • Improve Quality</p>
</header>

<div class="container">

<div class="box">

<h2>Upload Your Image</h2>

<div class="upload">
<input type="file" id="imageInput" accept="image/*">
</div>

<img id="preview" class="preview">

<div id="controls" class="controls">

<label>Upscale</label>

<select id="scale">
<option value="2">2× HD</option>
<option value="3">3× Ultra HD</option>
<option value="4">4× High Resolution</option>
</select>

<label>
Sharpness: <span id="sharpValue">50</span>
</label>

<input
type="range"
id="sharpness"
min="0"
max="100"
value="50"
>

<label>
Contrast: <span id="contrastValue">100</span>%
</label>

<input
type="range"
id="contrast"
min="80"
max="130"
value="100"
>

<label>
Brightness: <span id="brightnessValue">100</span>%
</label>

<input
type="range"
id="brightness"
min="80"
max="120"
value="100"
>

<button onclick="enhanceImage()">
✨ Enhance Image
</button>

<button id="downloadBtn">
⬇️ Download Enhanced Image
</button>

<div id="status" class="status"></div>

</div>

<p class="note">
Your image is processed directly in your browser.
</p>

</div>
</div>

<script>

const imageInput =
document.getElementById("imageInput");

const preview =
document.getElementById("preview");

const controls =
document.getElementById("controls");

const downloadBtn =
document.getElementById("downloadBtn");

const status =
document.getElementById("status");

let originalImage = new Image();

imageInput.addEventListener("change", function(){

const file = this.files[0];

if(!file) return;

const reader = new FileReader();

reader.onload = function(e){

originalImage.onload = function(){

preview.src = e.target.result;

preview.style.display = "block";

controls.style.display = "block";

downloadBtn.style.display = "none";

status.textContent = "";

};

originalImage.src = e.target.result;

};

reader.readAsDataURL(file);

});

const sharpness =
document.getElementById("sharpness");

const contrast =
document.getElementById("contrast");

const brightness =
document.getElementById("brightness");

sharpness.oninput = function(){

document.getElementById("sharpValue")
.textContent = this.value;

};

contrast.oninput = function(){

document.getElementById("contrastValue")
.textContent = this.value;

};

brightness.oninput = function(){

document.getElementById("brightnessValue")
.textContent = this.value;

};


function enhanceImage(){

status.textContent =
"⏳ Enhancing image...";

const scale =
Number(document.getElementById("scale").value);

const sharp =
Number(sharpness.value);

const cont =
Number(contrast.value);

const bright =
Number(brightness.value);

const canvas =
document.createElement("canvas");

canvas.width =
originalImage.width * scale;

canvas.height =
originalImage.height * scale;

const ctx =
canvas.getContext("2d");

ctx.imageSmoothingEnabled = true;

ctx.imageSmoothingQuality = "high";


ctx.filter =
"contrast(" + cont + "%) " +
"brightness(" + bright + "%)";


ctx.drawImage(
originalImage,
0,
0,
canvas.width,
canvas.height
);


/* Extra sharpening */

if(sharp > 0){

const imageData =
ctx.getImageData(
0,
0,
canvas.width,
canvas.height
);

const data =
imageData.data;

const amount =
sharp / 100;

for(
let y = 1;
y < canvas.height - 1;
y++
){

for(
let x = 1;
x < canvas.width - 1;
x++
){

const i =
(y * canvas.width + x) * 4;

for(let c = 0; c < 3; c++){

const center =
data[i+c];

const top =
data[i - canvas.width*4 + c];

const bottom =
data[i + canvas.width*4 + c];

const left =
data[i - 4 + c];

const right =
data[i + 4 + c];

const average =
(top + bottom + left + right) / 4;

data[i+c] =
Math.max(
0,
Math.min(
255,
center + (center-average)*amount
)
);

}

}

}

ctx.putImageData(
imageData,
0,
0
);

}


const result =
canvas.toDataURL(
"image/jpeg",
0.98
);

preview.src = result;

downloadBtn.onclick = function(){

const link =
document.createElement("a");

link.href = result;

link.download =
"enhanced-image.jpg";

link.click();

};

downloadBtn.style.display =
"block";

status.textContent =
"✅ Image enhanced successfully!";

}

</script>

</body>
</html>
